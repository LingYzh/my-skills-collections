name: Check distribution

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    check-distribution:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Compile PowerShell Skill helper scripts
              run: python -m py_compile skills/powershell-windows-cli/scripts/*.py

            - name: Smoke-test PowerShell static checker
              run: |
                  python skills/powershell-windows-cli/scripts/validate_ps.py -c "chcp 65001"
                  python skills/powershell-windows-cli/scripts/validate_ps.py -c 'cmd /c "tool.exe $path"'

            - name: Build generic Skill ZIPs
              run: python scripts/package-skills.py

            - name: Validate marketplace and release structure
              run: python scripts/validate-distribution.py
