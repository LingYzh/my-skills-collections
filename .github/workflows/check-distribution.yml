name: Check distribution

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    check-distribution:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Build generic Skill ZIPs
              run: python scripts/package-skills.py

            - name: Validate marketplace and release structure
              run: python scripts/validate-distribution.py
