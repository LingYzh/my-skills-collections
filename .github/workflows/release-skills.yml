name: Release skill ZIPs

on:
    push:
        branches:
            - master
        tags:
            - "v*"
        paths:
            - ".release-version"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (for example v0.2.0)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Resolve release tag
              id: release
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      TAG="$INPUT_TAG"
                  elif [[ "$REF_TYPE" == "tag" ]]; then
                      TAG="$REF_NAME"
                  else
                      TAG="$(tr -d '[:space:]' < .release-version)"
                  fi

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                      echo "Invalid release tag: $TAG" >&2
                      exit 1
                  fi

                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Build generic Agent Skill ZIPs
              run: python scripts/package-skills.py

            - name: Create or update GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
                  else
                      gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
                          --generate-notes \
                          --title "$TAG" \
                          --target "$GITHUB_SHA"
                  fi
