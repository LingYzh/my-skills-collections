name: Check plugin sync

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    check-plugin-sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Verify per-skill plugin distribution
              run: python scripts/sync-plugins.py --check
