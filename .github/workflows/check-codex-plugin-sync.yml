name: Check Codex plugin sync

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    check-codex-plugin-sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Verify Codex plugin skill bundle
              run: python scripts/sync-codex-plugin.py --check
